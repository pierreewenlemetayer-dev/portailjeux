<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="Portail des jeux : Chenille et Ping, deux jeux gratuits à découvrir."><title>Portail des jeux</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--blue:#2452a2;--ink:#203454;--muted:#60718a}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{max-width:1050px;min-height:100dvh;margin:auto;padding:clamp(24px,5vw,60px) 20px 22px;display:flex;flex-direction:column}h1{text-align:center;color:var(--blue);font:700 clamp(40px,7vw,68px)/1.08 Fredoka,Arial,sans-serif;margin:12px 0 clamp(35px,6vw,70px)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,32px)}.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#fff;border:1px solid #dce5f1;border-radius:22px;overflow:hidden;box-shadow:0 7px 24px rgba(25,59,108,.09);transition:transform .18s,box-shadow .18s}.game:hover,.game:focus-visible{transform:translateY(-4px);box-shadow:0 12px 30px rgba(25,59,108,.16);outline:none}.art{height:clamp(150px,22vw,240px);display:grid;place-items:center;overflow:hidden}.snake{background:#e9f6ef}.ping{background:#eaf1fd}.art svg{width:85%;height:85%;max-width:310px}.details{padding:22px;text-align:center;display:flex;flex:1;flex-direction:column;align-items:center;gap:11px}.details h2{font:700 clamp(28px,4vw,38px) Fredoka,Arial,sans-serif;margin:0}.details p{margin:0;color:var(--muted);font-size:15px}.play{margin-top:10px;display:inline-block;border-radius:12px;background:var(--blue);color:#fff;padding:11px 34px;font-weight:700}footer{margin-top:auto;padding-top:55px;text-align:center;color:#718097;font-size:13px}footer button{border:0;background:none;color:#536f9d;text-decoration:underline;cursor:pointer;font:inherit}dialog{border:1px solid #d8e1ed;border-radius:18px;max-width:min(90vw,500px);padding:28px;box-shadow:0 15px 70px #132e5060;color:var(--ink);line-height:1.6}dialog::backdrop{background:#13274477}dialog h2{font-family:Fredoka,Arial,sans-serif;color:var(--blue);margin-top:0}.close{background:var(--blue);border:0;border-radius:10px;color:white;padding:9px 22px;cursor:pointer;font-weight:bold}@media(max-width:620px){main{padding:22px 15px}h1{margin:14px 0 32px}.games{grid-template-columns:1fr;max-width:440px;width:100%;margin:0 auto}.art{height:155px}.details{padding:16px;gap:7px}.details h2{font-size:30px}.play{margin-top:7px}}@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style><style>h1 .home-title-link{color:inherit;font:inherit;letter-spacing:inherit;text-decoration:none;cursor:pointer}h1 .home-title-link:hover,h1 .home-title-link:visited,h1 .home-title-link:active{color:inherit;text-decoration:none}h1 .home-title-link:focus-visible{outline:2px solid currentColor;outline-offset:4px}</style></head><body><main><h1><a class="home-title-link" href="./" aria-label="Revenir à l’accueil">Portail des jeux</a></h1><section class="games" aria-label="Choisir un jeu"><a class="game" target="_blank" rel="noopener noreferrer" href="https://pierreewenlemetayer-dev.github.io/caterpillar/"><div class="art snake"><svg viewBox="0 0 320 190" aria-hidden="true"><rect x="15" y="10" width="290" height="170" rx="18" fill="#d4ecdf"/><path d="M65 125H120V83H175V126H225" stroke="#358c61" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="226" cy="126" r="20" fill="#27794f"/><circle cx="234" cy="119" r="4" fill="#fff"/><circle cx="235" cy="119" r="2" fill="#1d3e2d"/><circle cx="245" cy="58" r="12" fill="#e85f66"/><path d="M245 48Q245 40 253 38" fill="none" stroke="#5a8c47" stroke-width="3"/></svg></div><div class="details"><h2>Chenille</h2><p>Le jeu du serpent revisité</p><span class="play">Jouer</span></div></a><a class="game" target="_blank" rel="noopener noreferrer" href="https://pierreewenlemetayer-dev.github.io/ping/"><div class="art ping"><svg viewBox="0 0 320 190" aria-hidden="true"><rect x="18" y="8" width="284" height="174" rx="15" fill="#152943"/><g><rect x="37" y="28" width="44" height="17" rx="3" fill="#e56d80"/><rect x="88" y="28" width="44" height="17" rx="3" fill="#e56d80"/><rect x="139" y="28" width="44" height="17" rx="3" fill="#e56d80"/><rect x="190" y="28" width="44" height="17" rx="3" fill="#e56d80"/><rect x="241" y="28" width="44" height="17" rx="3" fill="#e56d80"/><rect x="37" y="52" width="44" height="17" rx="3" fill="#f0bf62"/><rect x="88" y="52" width="44" height="17" rx="3" fill="#f0bf62"/><rect x="190" y="52" width="44" height="17" rx="3" fill="#f0bf62"/><rect x="241" y="52" width="44" height="17" rx="3" fill="#f0bf62"/><rect x="37" y="76" width="44" height="17" rx="3" fill="#65bcb0"/><rect x="88" y="76" width="44" height="17" rx="3" fill="#65bcb0"/><rect x="139" y="76" width="44" height="17" rx="3" fill="#65bcb0"/><rect x="241" y="76" width="44" height="17" rx="3" fill="#65bcb0"/></g><circle cx="180" cy="120" r="9" fill="white"/><rect x="116" y="158" width="90" height="10" rx="5" fill="#e7f0ff"/></svg></div><div class="details"><h2>Ping</h2><p>Un jeu de pong</p><span class="play">Jouer</span></div></a></section><footer><button type="button" id="about">Le projet</button><div>© 2026</div></footer></main><dialog id="info"><h2>Le projet</h2><p>Le Portail des jeux rassemble des jeux gratuits accessibles depuis un navigateur, sur ordinateur comme sur téléphone.</p><p>Conçu pour évoluer, il accueillera progressivement de nouveaux jeux.</p><button class="close" id="close">Fermer</button></dialog><script>const dialog=document.getElementById('info');document.getElementById('about').addEventListener('click',()=>dialog.showModal());document.getElementById('close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});</script></body></html>
